name: calypso-migration
description: Retrieve booking, insert data, and migrate
version: "1.0"

inputs:
  - name: pnr_number
    type: string
    prompt: "Enter PNR number"
    required: true

steps:
  - id: retrieve_booking
    name: Retrieve Booking
    type: http
    config:
      method: POST
      url: "{{profile.base_url}}/selling/api/public-booking/v1/rest/bkg/pnr/retrieve"
      headers:
        Content-Type: application/json
        Accept: application/json
        x-session-token: "{{profile.session_token}}"
        x-auth-channel: "CalypsoNativeUI@RCG"
      body:
        SuperPnrNumber: "{{inputs.pnr_number}}"
    output: booking_data

  - id: insert_data
    name: Insert to Migration DB
    type: http
    config:
      method: POST
      url: "{{profile.dm_service_url}}/calypso/insertData"
      headers:
        Content-Type: application/json
      body: "{{booking_data}}"
    output: insert_result

  - id: migrate_booking
    name: Call Migrate Booking API
    type: http
    condition: "insert_result.success == true"
    config:
      method: POST
      url: "{{profile.calypso_local_url}}/calypso/api/public-booking/v1/rest/bkg/pnr/migrateBooking"
      headers:
        Content-Type: application/json
        Accept: application/json
        x-session-token: "{{profile.session_token}}"
        x-auth-channel: "CalypsoNativeUI@RCG"
      body: "{{insert_result.request_payload}}"
    output: migration_result
