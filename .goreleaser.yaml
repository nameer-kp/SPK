version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: atem
    main: ./cmd/atem
    binary: atem
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - docs/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: nameer-kp
    name: atem
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: atem
    repository:
      owner: nameer-kp
      name: village-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      private: true
    skip_upload: auto
    directory: Formula
    homepage: "https://github.com/nameer-kp/atem"
    description: "Task automation for developers and ops teams"
    license: "MIT"
    test: |
      system "#{bin}/atem", "--version"
    install: |
      bin.install "atem"
